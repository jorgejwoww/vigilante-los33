name: Vigilar mesa Los 33

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos (GitHub a veces se retrasa un poco)
  workflow_dispatch:         # botón para lanzarlo a mano
    inputs:
      prueba_whatsapp:
        description: "Solo mandar un WhatsApp de prueba"
        type: boolean
        default: false

permissions:
  contents: write            # necesario para el "sigo vivo" mensual (ver abajo)

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mandar WhatsApp de prueba
        if: ${{ inputs.prueba_whatsapp }}
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python los33.py --prueba-whatsapp
      - name: Buscar mesa
        if: ${{ !inputs.prueba_whatsapp }}
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: python los33.py
      # GitHub apaga las tareas programadas de un proyecto si pasa 60 días sin cambios.
      # Una vez al mes (día 1, entre las 4:00 y 4:05 UTC) se guarda una nota para que siga activo.
      - name: Sigo vivo (mensual)
        if: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$(date -u +%d%H)" = "0104" ] && [ "$(date -u +%M)" -lt 5 ]; then
            date -u > ultima-vez-activo.txt
            git config user.name "vigilante"
            git config user.email "vigilante@users.noreply.github.com"
            git add ultima-vez-activo.txt
            git commit -m "Sigo vivo" && git push
          fi

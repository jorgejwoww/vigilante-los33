name: Prueba con otro restaurante

# Solo se lanza a mano (pestaña Actions > "Prueba con otro restaurante" > Run workflow).
# Usa el mismo programa que el vigilante de Los 33, pero con otro restaurante
# que si tiene mesas, para comprobar que el aviso por WhatsApp llega de verdad.
on:
  workflow_dispatch:
    inputs:
      restaurante:
        description: "Codigo del restaurante en CoverManager"
        default: "restaurante-brach-madrid"
      hora:
        description: "Hora a comprobar"
        default: "21:00"

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar mesa (prueba)
        env:
          WHATSAPP_TELEFONO: ${{ secrets.WHATSAPP_TELEFONO }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          RESTAURANTE_PRUEBA: ${{ inputs.restaurante }}
          HORA_PRUEBA: ${{ inputs.hora }}
        run: |
          python - <<'EOF'
          import os
          import los33 as v
          v.RESTAURANTE = os.environ["RESTAURANTE_PRUEBA"]
          v.ENLACE = f"{v.WEB}/reservation/module_restaurant/{v.RESTAURANTE}/spanish"
          v.HORAS = [os.environ["HORA_PRUEBA"]]
          v.DIAS = [2]  # solo miercoles, para que el mensaje sea corto
          original = v.enviar_whatsapp
          v.enviar_whatsapp = lambda texto: original(
              "PRUEBA (" + v.RESTAURANTE + "), no es Los 33.\n\n" + texto
          )
          v.main()
          EOF
